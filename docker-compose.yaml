version: '3.8'
services:

  #######################################
  #          OPENVPN-MFA-SERVER         #
  #######################################

  openvpn-mfa:
    build: ./image/openvpn-mfa/
    hostname: 'openvpn-mfa-server'
    container_name: 'openvpn-mfa'
    cap_add:
      - NET_ADMIN
    network_mode: host
    devices:
      - /dev/net/tun0:/dev/net/tun
#    devices:
#      - /dev/net/tun
    environment:
      - EASYRSA_PKI=/root/pki
      - EASYRSA_BATCH=1
    volumes:
      - /root/pki/:/root/pki/ # dir for keys of CA
      - /etc/openvpn-mfa/:/etc/openvpn/ # dir for openvpn configs
      - /etc/openvpn-mfa/pam/:/etc/pam.d/ # dir for pam module configs
      - /opt/openvpn-mfa/:/home/ # dir for google-auth private keys
      - /opt/openvpn-mfa-ccd/:/etc/openvpn/ccd/ # dir for client configs
      - /var/log/openvpn-mfa/:/var/log/ # dir for logs
    restart: unless-stopped

  #######################################
  #            OPENVPN-SERVER           #
  #######################################

  openvpn:
    build: ./image/openvpn/
    hostname: 'openvpn-server'
    container_name: 'openvpn'
    cap_add:
      - NET_ADMIN
    network_mode: host
    devices:
      - /dev/net/tun1:/dev/net/tun
#    devices:
#      - /dev/net/tun
    environment:
      - EASYRSA_PKI=/root/pki
      - EASYRSA_BATCH=1
    volumes:
      - /root/pki/:/root/pki/ # dir for keys of CA
      - /etc/openvpn/:/etc/openvpn/ # dir for openvpn configs
      - /etc/openvpn/pam/:/etc/pam.d/ # dir for pam module configs
      - /opt/openvpn-mfa/:/home/ # dir for google-auth private keys
      - /opt/openvpn-ccd/:/etc/openvpn/ccd/ # dir for client configs
      - /var/log/openvpn:/var/log/ # dir for logs
    restart: unless-stopped


